<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Prep Coach</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.10.1/jsxgraph.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.10.1/jsxgraphcore.js"></script>
<style>
:root { --bg:#fbfaf7; --fg:#1f2328; --muted:#5b6470; --card:#fff; --line:#e3e0d8; --accent:#2f6f8f; --warn:#8a5a00; --warnbg:#fff4dc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16181b; --fg:#e8e6e1; --muted:#a3abb5; --card:#1f2226; --line:#33373d; --accent:#7fb8d6; --warn:#f0c46b; --warnbg:#2e2614; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, sans-serif; }
header { padding:16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
header h1 { font-size:1.15rem; margin:0 auto 0 0; }
select, button, textarea, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
button { cursor:pointer; } button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:24px; max-width:1200px; margin:0 auto; padding:16px; }
@media (max-width: 900px) { .layout { grid-template-columns:1fr; } }
.tabs { display:flex; gap:8px; margin-bottom:12px; } .tabs [aria-selected=true] { background:var(--accent); color:var(--bg); border-color:var(--accent); }
main section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:16px; }
main h2 { font-size:1.1rem; margin:0 0 8px; color:var(--accent); } main h3 { font-size:.98rem; margin:16px 0 6px; } section[id] { scroll-margin-top:12px; }
.banner { background:var(--warnbg); color:var(--warn); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:.92rem; }
.muted { color:var(--muted); font-size:.9rem; }
aside { position:sticky; top:16px; align-self:start; }
aside details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:12px; }
aside summary { cursor:pointer; font-weight:600; }
aside textarea { width:100%; min-height:80px; margin:8px 0; }
.notes { width:100%; min-height:90px; } .sketch { width:100%; height:260px; border:1px dashed var(--line); border-radius:8px; touch-action:none; background:var(--bg); }
.answer { white-space:pre-wrap; border-left:3px solid var(--accent); padding:4px 10px; margin-top:8px; }
.board { width:100%; max-width:560px; aspect-ratio:4/3; }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
.controls input { width:80px; } .controls input.wide { width:220px; }
ol, ul { padding-left:1.3em; } li { margin-bottom:6px; }
@media print { header, aside, .noprint { display:none; } .layout { display:block; } main section { break-inside:avoid; border:none; } }
</style>
</head>
<body>
<header>
  <h1>Lesson Prep Coach</h1>
  <label class="muted" for="grade">Grade</label>
  <select id="grade"></select>
  <label class="muted" for="topic">Topic</label>
  <select id="topic" disabled></select>
  <button class="noprint" onclick="print()">Print notes</button>
</header>
<div class="layout">
  <main>
    <div class="tabs noprint" role="tablist">
      <button role="tab" id="tab-notes" aria-selected="true" onclick="showTab('notes')">Prep notes</button>
      <button role="tab" id="tab-mine" aria-selected="false" onclick="showTab('mine')">My notes</button>
    </div>
    <div id="notes" role="tabpanel"><p class="muted">Choose a grade and a topic to see your prep notes.</p></div>
    <div id="mine" role="tabpanel" hidden></div>
  </main>
  <aside class="noprint" aria-label="Optional help">
    <details open>
      <summary>Ask the coach</summary>
      <p class="muted">Optional. One question, one answer. <span id="remaining"></span></p>
      <label for="explain" class="muted">Explain a part differently</label>
      <select id="explain" style="width:100%"><option value="">Choose a part…</option></select>
      <label for="question" class="muted">Or type your own question</label>
      <textarea id="question" maxlength="500" placeholder="e.g. How do I explain why we flip the second fraction?"></textarea>
      <button class="primary" id="askbtn">Ask</button>
      <div id="answer" aria-live="polite"></div>
    </details>
    <details>
      <summary>Tell us what you need</summary>
      <p class="muted">What would help you prepare? Please don't include names or personal details.</p>
      <textarea id="feedback" maxlength="2000"></textarea>
      <button id="fbbtn">Send</button> <span id="fbdone" class="muted" aria-live="polite"></span>
    </details>
  </aside>
</div>
<script>
const $ = id => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
let teacher; try { teacher = localStorage.getItem('coachTeacher') || crypto.randomUUID(); localStorage.setItem('coachTeacher', teacher); } catch { teacher = crypto.randomUUID(); }
let topics = [], current = null, sheet = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || 'Something went wrong.');
  return d;
}

async function loadTopics() {
  topics = (await api('/api/topics?standard=ccss')).topics;
  const grade = $('grade'), topic = $('topic');
  // Grades and topics come from the standard's mapping file, so a new standard or topic needs no UI change.
  grade.replaceChildren(new Option('Choose a grade…', ''), ...[...new Set(topics.map(t => t.grade))].map(g => new Option(`Grade ${g}`, g)));
  grade.onchange = () => {
    const list = topics.filter(t => String(t.grade) === grade.value);
    topic.replaceChildren(new Option(list.length ? 'Choose a topic…' : 'Choose a grade first', ''),
      ...list.map(t => new Option(`${t.title}${t.ready ? '' : ' (coming soon)'}`, t.concept)));
    topic.disabled = !list.length;
  };
  topic.onchange = () => topic.value && openTopic(topic.value);
  grade.onchange();
}

const KIND = {picture: 'With a picture', story: 'With a story', procedure: 'Step by step'};
const add = (parent, ...kids) => { parent.append(...kids); return parent; };

async function openTopic(id) {
  current = topics.find(t => t.concept === id);
  const main = $('notes'); main.replaceChildren(el('p', current.ready ? 'Loading…' : 'Preparing these notes for the first time and checking every answer. This can take a minute…', 'muted'));
  let s; try { s = await api(`/api/sheet/${id}`); current.ready = true; } catch (e) { main.replaceChildren(el('p', e.message, 'banner')); return; }
  sheet = s; const m = s.meta; main.replaceChildren();
  if (!$('mine').hidden) renderMine();
  main.append(el('div', 'Written by AI and checked automatically (every answer is recomputed). Not yet reviewed by a math educator. ' +
    (m.grounded_on ? 'Based on a checked lesson text.' : 'No checked lesson text exists for this topic yet, so read with extra care.'), 'banner'));

  // 1. What this lesson covers + the 40-minute plan (the core of the class)
  const top = add(el('section'), el('h2', m.title), el('p', `Grade ${current.grade} · ${current.code} (Common Core)`, 'muted'), el('h3', 'What this lesson covers'));
  const toc = el('ol'); s.subtopics.forEach((t, i) => { const a = el('a', t.title); a.href = `#part-${i + 1}`; toc.append(add(el('li'), a)); });
  top.append(toc, el('h3', 'Your 40-minute lesson plan'));
  const plan = el('ol'); s.lesson_outline.forEach(x => plan.append(el('li', `${x.minutes} min: ${x.activity}`))); top.append(plan); main.append(top);

  // 2. Short theory + example (for the teacher, before class)
  const th = add(el('section'), el('h2', 'Short theory'), el('p', s.idea), el('h3', 'Why it works'), el('p', s.why), el('h3', 'Example'));
  exampleBlock(th, s.theory_example); main.append(th);

  // 3. Each subtopic, in teaching order
  s.subtopics.forEach((t, i) => {
    const sec = add(el('section'), el('h2', `Part ${i + 1}: ${t.title}`)); sec.id = `part-${i + 1}`;
    sec.append(el('h3', 'Two ways to explain it'));
    t.ways_to_explain.forEach(w => sec.append(el('p', `${KIND[w.kind]}: ${w.text}`)));
    sec.append(el('h3', 'Example')); exampleBlock(sec, t.example); sec.append(drawing(current.visual, t.visual));
    sec.append(el('h3', 'Common mistakes'));
    const ul = el('ul'); t.mistakes.forEach(x => ul.append(add(el('li'), el('strong', x.mistake), el('div', x.response)))); sec.append(ul);
    sec.append(el('h3', 'Questions students may ask'));
    t.student_questions.forEach(x => sec.append(el('p', `“${x.question}”`), el('p', x.answer, 'answer')));
    sec.append(el('h3', 'Check question for the class'), el('p', t.check_question.question),
      add(el('details'), el('summary', 'Show answer'), el('p', t.check_question.solution)));
    main.append(sec);
  });

  // 4. Last 10 minutes: extra examples and questions round
  const ex = add(el('section'), el('h2', 'Last 10 minutes: extra examples and questions'));
  s.extra_examples.forEach(x => ex.append(el('p', x.problem), add(el('details'), el('summary', 'Show solution'), el('p', x.solution))));
  main.append(ex);

  if (s.teacher_faq?.length) { const f = add(el('section'), el('h2', 'Questions other teachers asked')); s.teacher_faq.forEach(x => f.append(el('p', `“${x.question}”`), el('p', x.answer, 'answer'))); main.append(f); }
  const res = add(el('section'), el('h2', 'More resources')); const rl = el('ul');
  s.resources.forEach(r => { const a = el('a', r.name); a.href = r.url; a.target = '_blank'; a.rel = 'noopener'; rl.append(add(el('li'), a)); });
  res.append(rl); main.append(res);
  if (s.videos?.length) {  // from the YouTube Data API, confirmed via oEmbed; titles are YouTube's, not ours
    const vs = add(el('section'), el('h2', 'Top videos on this topic (YouTube)'),
      el('p', 'Chosen by YouTube search with SafeSearch on. External videos: not reviewed by us. Please watch before showing them in class.', 'muted'));
    const vl = el('ol'); s.videos.forEach(v => { const a = el('a', v.title); a.href = v.url; a.target = '_blank'; a.rel = 'noopener';
      vl.append(add(el('li'), a, el('span', ` · ${v.channel}`, 'muted'))); });
    vs.append(vl); main.append(vs);
  }
  const exp = $('explain'); exp.replaceChildren(new Option('Choose a part…', ''), new Option('Short theory', 'Short theory'));
  s.subtopics.forEach((t, i) => exp.append(new Option(`Part ${i + 1}: ${t.title}`, t.title)));
}

function exampleBlock(parent, x) { parent.append(el('p', x.problem), el('p', x.steps), el('p', `Answer: ${x.answer}`, 'muted')); }

// ---- Teacher's own notes and sketches: kept only in this browser, never sent to the server. ----
// shortcut: device-only storage; move to the teacher's account once sign-in exists (see TODO).
const store = {get: k => { try { return localStorage.getItem('coach:' + k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem('coach:' + k, v); } catch {} }};
// "My notes" tab: the teacher's own space, kept apart from the notes we provide.
function showTab(name) {
  for (const t of ['notes', 'mine']) { $(t).hidden = t !== name; $('tab-' + t).setAttribute('aria-selected', t === name); }
  if (name === 'mine') renderMine();  // built when shown, so the sketch pad gets its real size
}
function renderMine() {
  const mine = $('mine');
  if (!current || !sheet) { mine.replaceChildren(el('p', 'Choose a grade and a topic first.', 'muted')); return; }
  const sec = add(el('section'), el('h2', `My notes: ${current.title}`), el('p', 'Only you can see these. They are saved on this device and never sent anywhere.', 'muted'),
    notesBox(`${current.concept}:lesson`, 'For the whole lesson'));
  sheet.subtopics.forEach((t, i) => sec.append(notesBox(`${current.concept}:part${i + 1}`, `Part ${i + 1}: ${t.title}`)));
  sec.append(sketchPad(`${current.concept}:sketch`));
  mine.replaceChildren(sec);
}
function notesBox(key, label) {
  const t = el('textarea'); t.className = 'notes'; t.value = store.get(key) || ''; t.setAttribute('aria-label', label);
  t.placeholder = 'Your own points, examples or reminders. Saved only on this device.';
  t.oninput = () => store.set(key, t.value);
  return add(el('div'), el('h3', label), t);
}
function sketchPad(key) {
  const cv = el('canvas'); cv.className = 'sketch'; cv.setAttribute('aria-label', 'Sketch pad for your own drawings');
  const ctx = cv.getContext('2d'); let down = false;
  const fit = () => { const r = cv.getBoundingClientRect(); cv.width = r.width; cv.height = r.height; const img = store.get(key);
    if (img) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0); i.src = img; } };
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); };
  cv.onpointermove = e => { if (!down) return; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = getComputedStyle(document.body).color; ctx.lineTo(...pos(e)); ctx.stroke(); };
  cv.onpointerup = () => { down = false; store.set(key, cv.toDataURL()); };
  const clear = el('button', 'Clear'); clear.onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); store.set(key, ''); };
  const save = el('button', 'Download image'); save.onclick = () => { const a = el('a'); a.href = cv.toDataURL(); a.download = `${key.replace(':', '-')}.png`; a.click(); };
  requestAnimationFrame(fit);
  return add(el('div'), el('h3', 'My sketch pad'), el('p', 'Draw with a mouse, pen or finger. Saved only on this device.', 'muted noprint'), cv, add(el('div', null, 'controls noprint'), clear, save));
}

// ---- Drawings: fixed JSXGraph templates filled with checked values. The model never writes drawing code. ----
function drawing(kind, p) {
  // Only where the sheet asks for one, and only if it actually draws: an empty chart is never shown.
  if (!p || p.kind === 'none' || p.kind !== kind || !TEMPLATES[kind]) return document.createDocumentFragment();
  const box = el('div', null, 'board jxgbox'); box.id = 'board' + Math.random().toString(36).slice(2);
  const controls = el('div', null, 'controls noprint');
  const wrap = add(el('div'), el('p', {graph: 'Change the function and press Draw.', triangle: 'Drag the corners.', numberline: 'Move the sliders.',
    fractionbar: 'Change the fractions and press Show.', bars: 'Change the values and press Show.'}[kind], 'muted noprint'), controls, box);
  requestAnimationFrame(() => { try { if (TEMPLATES[kind](box.id, controls, p) === false) wrap.remove(); } catch { wrap.remove(); } });
  return wrap;
}
const input = (controls, label, value, cls) => { const l = el('label', label + ' '); const i = el('input'); i.value = value; if (cls) i.className = cls; l.append(i); controls.append(l); return i; };
const button = (controls, label, fn) => { const b = el('button', label); b.onclick = fn; controls.append(b); fn(); };
const board = (id, bb, axis = true) => JXG.JSXGraph.initBoard(id, {boundingbox: bb, axis, showCopyright: false, showNavigation: false, keepAspectRatio: false});
const txt = (b, x, y, t) => b.create('text', [x, y, t], {fontSize: 14, display: 'internal'});  // internal = SVG text, never HTML
const TEMPLATES = {
  graph(id, c, p) {
    if (!p.expr.trim()) return false;
    const f = input(c, 'f(x) =', p.expr, 'wide'); const b = board(id, [-10, 10, 10, -10]); let curves = [];
    const draw = () => {
      const funcs = f.value.split(';').map(e => e.trim().replace(/\bpi\b/g, 'PI')).filter(Boolean).map(e => b.jc.snippet(e, true, 'x', true));
      const ys = funcs.flatMap(fn => Array.from({length: 81}, (_, i) => fn(-10 + i / 4))).filter(Number.isFinite);
      if (!ys.length) throw new Error('nothing to draw');
      const lo = Math.max(-1000, Math.min(-1, ...ys)), hi = Math.min(1000, Math.max(1, ...ys)), pad = (hi - lo) * .1;
      curves.forEach(g => b.removeObject(g)); b.setBoundingBox([-10, hi + pad, 10, lo - pad], false);
      curves = funcs.map(fn => b.create('functiongraph', [fn], {strokeWidth: 3}));
    };
    draw();  // first draw: a failure removes the whole drawing (see drawing())
    const btn = el('button', 'Draw'); c.append(btn);
    btn.onclick = () => { try { draw(); f.setCustomValidity(''); } catch { f.setCustomValidity('Could not read that function'); f.reportValidity(); } };
  },
  triangle(id, c, p) {
    const b = board(id, [-1, 10, 13, -1]);
    const C = b.create('point', [0, 0], {name: '', fixed: true, size: 2});
    const B = b.create('glider', [p.b || 4, 0, b.defaultAxes.x], {name: 'drag', size: 4});
    const A = b.create('glider', [0, p.a || 3, b.defaultAxes.y], {name: 'drag', size: 4});
    b.create('polygon', [C, B, A], {fillOpacity: .15});
    txt(b, .5, 9.3, () => { const a = A.Y(), bb = B.X(), c2 = a * a + bb * bb;
      return `a = ${a.toFixed(1)}, b = ${bb.toFixed(1)}: a² + b² = ${(a * a).toFixed(1)} + ${(bb * bb).toFixed(1)} = ${c2.toFixed(1)}, so c = ${Math.sqrt(c2).toFixed(2)}`; });
  },
  numberline(id, c, p) {
    const b = board(id, [-22, 5, 22, -4]);
    const a = b.create('slider', [[-20, 4], [-6, 4], [-20, p.a, 20]], {name: 'a', snapWidth: 1});
    const k = b.create('slider', [[4, 4], [18, 4], [-20, p.b, 20]], {name: 'b', snapWidth: 1});
    b.create('arrow', [[0, .6], [() => a.Value(), .6]], {strokeWidth: 3, strokeColor: '#2f6f8f'});
    b.create('arrow', [[() => a.Value(), 1.4], [() => a.Value() + k.Value(), 1.4]], {strokeWidth: 3, strokeColor: '#c0392b'});
    txt(b, -21, -2.5, () => `a + b = ${a.Value()} + (${k.Value()}) = ${a.Value() + k.Value()}` + (p.c === 1 ? `      a · b = ${a.Value()} · (${k.Value()}) = ${a.Value() * k.Value()}` : ''));
  },
  fractionbar(id, c, p) {
    if (![p.a, p.b, p.c, p.d].every(v => Number.isInteger(v) && v > 0)) return false;
    const ins = [input(c, '', p.a), input(c, '/', p.b), input(c, '÷', p.c), input(c, '/', p.d)];
    const out = el('p', null, 'muted'); let b = null;
    button(c, 'Show', () => {
      const [a, bb, cc, dd] = ins.map(i => parseInt(i.value, 10));
      if (![a, bb, cc, dd].every(v => v > 0 && v <= 24)) { out.textContent = 'Use whole numbers from 1 to 24.'; return; }
      const first = a / bb, piece = cc / dd, wholes = Math.ceil(Math.max(1, first));
      if (b) JXG.JSXGraph.freeBoard(b); b = board(id, [-.1, 3, wholes + .1, -1], false);
      for (let i = 0; i < wholes; i++) b.create('polygon', [[i, 2], [i + 1, 2], [i + 1, 1.5], [i, 1.5]], {fillOpacity: 0, borders: {strokeColor: '#888'}, vertices: {visible: false}});
      b.create('polygon', [[0, 2], [first, 2], [first, 1.5], [0, 1.5]], {fillColor: '#2f6f8f', fillOpacity: .4, vertices: {visible: false}});
      for (let x = 0, i = 0; x < first - 1e-9; x += piece, i++) b.create('polygon', [[x, 1.2], [Math.min(x + piece, first), 1.2], [Math.min(x + piece, first), .7], [x, .7]], {fillColor: i % 2 ? '#e67e22' : '#f5b041', fillOpacity: .7, vertices: {visible: false}});
      const g = (x, y) => y ? g(y, x % y) : x, num = a * dd, den = bb * cc, k = g(num, den);
      out.textContent = `Blue: ${a}/${bb}. Orange pieces: ${cc}/${dd} each. ${a}/${bb} ÷ ${cc}/${dd} = ${num / k}/${den / k} (≈ ${(num / den).toFixed(2)}) pieces fit.`;
    });
    c.append(out);
  },
  bars(id, c, p) {
    const labels = p.expr.split(';').map(s => s.trim()).filter(Boolean).slice(0, 4);
    if (!labels.length || ![p.a, p.b, p.c, p.d].slice(0, labels.length).some(v => v > 0)) return false;
    const ins = labels.map((l, i) => input(c, l, [p.a, p.b, p.c, p.d][i])); let b = null;
    button(c, 'Show', () => {
      const v = ins.map(i => Math.max(0, parseFloat(i.value) || 0)), max = Math.max(1, ...v);
      if (b) JXG.JSXGraph.freeBoard(b); b = board(id, [-.5, max * 1.25, labels.length, -max * .18], false);
      v.forEach((h, i) => { b.create('polygon', [[i, 0], [i + .7, 0], [i + .7, h], [i, h]], {fillColor: '#2f6f8f', fillOpacity: .5, vertices: {visible: false}});
        txt(b, i, -max * .08, labels[i]); txt(b, i, h + max * .06, String(h)); });
    });
  },
};

// ---- Ask the coach (side tab) ----
async function ask(question, force = false) {
  if (!current) { $('answer').replaceChildren(el('p', 'Choose a topic first.', 'muted')); return; }
  $('answer').replaceChildren(el('p', 'Thinking…', 'muted')); $('askbtn').disabled = true;
  try {
    const d = await api('/api/ask', {concept: current.concept, question, teacher, force});
    const parts = [];
    if (d.cached && d.matched_question !== question) {
      parts.push(el('p', `Answer to a very similar question: “${d.matched_question}”`, 'muted'));
      const again = el('button', 'Ask mine anyway'); again.onclick = () => ask(question, true); parts.push(again);
    }
    parts.push(el('div', d.answer, 'answer'), el('p', 'AI answer, not reviewed by an educator.', 'muted'));
    $('answer').replaceChildren(...parts); $('remaining').textContent = `${d.remaining} questions left this month.`;
  } catch (e) { $('answer').replaceChildren(el('p', e.message, 'banner')); }
  $('askbtn').disabled = false;
}
$('askbtn').onclick = () => { const q = $('question').value.trim(); if (q) ask(q); };
$('explain').onchange = e => e.target.value && ask(`Explain "${e.target.value}" in a different way.`);
$('fbbtn').onclick = async () => {
  try { await api('/api/feedback', {concept: current?.concept, text: $('feedback').value}); $('feedback').value = ''; $('fbdone').textContent = 'Thank you, we read every message.'; }
  catch (e) { $('fbdone').textContent = e.message; }
};
loadTopics();
</script>
</body>
</html>
